<div class="reset-container">

  <div class="top-banner">
    <img src="/assets/gov-logo.png" alt="GOV.CO" class="top-banner-logo-img" />
  </div>

  <header class="header">
    <div class="logo">
      <h1>PQRSync</h1>
    </div>
  </header>

  <div class="reset-wrapper">
    <div class="reset-card">
      <div class="reset-icon">🔐</div>

      @if (enlaceValido() === false) {
        <h2>Enlace no válido</h2>
        <p class="reset-sub">
          Este enlace ya se usó o expiró. Solicita uno nuevo para restablecer tu contraseña.
        </p>
        <button class="reset-btn" (click)="irARecuperar()">Solicitar nuevo enlace</button>
      } @else {
        <h2>Restablecer Contraseña</h2>
        <p class="reset-sub">Ingresa tu nueva contraseña</p>

        <div class="input-group">
          <input type="password" [(ngModel)]="newPassword" placeholder=" " />
          <label>Nueva contraseña</label>
        </div>

        <div class="input-group">
          <input type="password" [(ngModel)]="confirmPassword" placeholder=" " />
          <label>Confirmar contraseña</label>
        </div>

        <button class="reset-btn" (click)="resetPassword()" [disabled]="loading || enlaceValido() === null">
          {{ loading ? 'Guardando...' : 'Guardar nueva contraseña' }}
        </button>
      }
    </div>
  </div>

</div>
